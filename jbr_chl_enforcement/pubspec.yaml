name: jbr_chl_enforcement
description: "RB CHL is a mobile enforcement app for Android and iPhone, enabling agents to verify vehicles and haulage trips using RFID, QR codes, plate entry and OCR."

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  go_router: ^18.0.2
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  sqlcipher_flutter_libs: ^0.7.0+eol
  flutter_secure_storage: ^11.2.0
  workmanager: ^0.10.10
  connectivity_plus: ^7.0.0
  geolocator: ^14.0.1
  camera: ^0.12.1
  mobile_scanner: ^7.4.2
  google_mlkit_text_recognition: ^0.17.1
  uuid: ^4.6.0
  path_provider: ^2.1.6
  path: ^1.9.1
  equatable: ^3.0.0
  device_preview: ^3.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  intl: ^0.20.3
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0
  flutter_blue_plus: ^2.3.14
  nfc_manager: ^4.2.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0
  flutter_local_notifications: ^22.3.1
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  drift_dev: ^2.35.1
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/logo/logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo/logo.png"

  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/poppins/OFL.txt
    - assets/splash/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
